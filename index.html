<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>

    <p id="turn" class="turn">Your turn! Pick one.</p>

    <section class="scoreboard">
      <div class="score-box">
        <span class="label">You</span>
        <span id="player-score" class="points">0</span>
      </div>
      <span class="vs">VS</span>
      <div class="score-box">
        <span class="label">Computer</span>
        <span id="computer-score" class="points">0</span>
      </div>
    </section>

    <section class="arena">
      <div class="pick" id="player-pick">❔</div>
      <div class="pick" id="computer-pick">❔</div>
    </section>

    <p id="result" class="result">Make your move!</p>

    <section class="choices">
      <button class="choice-btn" data-choice="rock">🪨<span>Rock</span></button>
      <button class="choice-btn" data-choice="paper">📄<span>Paper</span></button>
      <button class="choice-btn" data-choice="scissors">✂️<span>Scissors</span></button>
    </section>

    <button id="reset" class="reset-btn">Reset Score</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
